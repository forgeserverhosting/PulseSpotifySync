name: Build Pulse v0.3 Clean

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create app
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/pulse

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }

          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }

          rootProject.name = "Pulse"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id "com.android.application" version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id "com.android.application"
          }

          android {
            namespace "com.example.pulse"
            compileSdk 35

            defaultConfig {
              applicationId "com.example.pulse"
              minSdk 26
              targetSdk 35
              versionCode 3
              versionName "0.3"
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>

            <uses-permission
              android:name="android.permission.READ_EXTERNAL_STORAGE"
              android:maxSdkVersion="32"/>

            <application
              android:label="Pulse"
              android:theme="@android:style/Theme.Material.NoActionBar">

              <activity
                android:name=".MainActivity"
                android:exported="true">

                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>

              </activity>

            </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/example/pulse/MainActivity.java <<'EOF'
          package com.example.pulse;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentUris;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.media.MediaPlayer;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;

          public class MainActivity extends Activity {

            static class Song {
              String title;
              String artist;
              Uri uri;

              Song(String title, String artist, Uri uri) {
                this.title = title;
                this.artist = artist;
                this.uri = uri;
              }
            }

            final ArrayList<Song> songs = new ArrayList<>();
            final ArrayList<String> labels = new ArrayList<>();
            final Handler handler = new Handler();

            ListView list;

            TextView status;
            TextView now;

            SeekBar seek;

            Button play;

            MediaPlayer player;

            int current = -1;

            final Runnable tick = new Runnable() {
              @Override
              public void run() {
                try {
                  if (player != null) {
                    seek.setMax(
                      Math.max(
                        player.getDuration(),
                        1
                      )
                    );

                    seek.setProgress(
                      player.getCurrentPosition()
                    );
                  }
                } catch (Exception ignored) {
                }

                handler.postDelayed(
                  this,
                  500
                );
              }
            };

            @Override
            protected void onCreate(Bundle bundle) {
              super.onCreate(bundle);

              buildUi();
              requestAudio();

              handler.post(tick);
            }

            void buildUi() {

              LinearLayout root =
                new LinearLayout(this);

              root.setOrientation(
                LinearLayout.VERTICAL
              );

              root.setPadding(
                28,
                28,
                28,
                28
              );

              root.setBackgroundColor(
                Color.rgb(
                  8,
                  9,
                  13
                )
              );

              TextView logo =
                new TextView(this);

              logo.setText("PULSE");

              logo.setTextColor(
                Color.WHITE
              );

              logo.setTextSize(34);

              logo.setTypeface(
                Typeface.DEFAULT_BOLD
              );

              root.addView(logo);

              TextView subtitle =
                new TextView(this);

              subtitle.setText(
                "Your playlists. Your music. Your player."
              );

              subtitle.setTextColor(
                Color.rgb(
                  150,
                  150,
                  160
                )
              );

              subtitle.setTextSize(15);

              root.addView(subtitle);

              LinearLayout actions =
                new LinearLayout(this);

              actions.setOrientation(
                LinearLayout.HORIZONTAL
              );

              actions.setPadding(
                0,
                18,
                0,
                12
              );

              Button refresh =
                new Button(this);

              refresh.setText(
                "Refresh"
              );

              refresh.setAllCaps(false);

              Button spotify =
                new Button(this);

              spotify.setText(
                "Spotify Import"
              );

              spotify.setAllCaps(false);

              actions.addView(
                refresh,
                new LinearLayout.LayoutParams(
                  0,
                  -2,
                  1
                )
              );

              actions.addView(
                spotify,
                new LinearLayout.LayoutParams(
                  0,
                  -2,
                  1
                )
              );

              root.addView(actions);

              status =
                new TextView(this);

              status.setText(
                "Scanning music..."
              );

              status.setTextColor(
                Color.LTGRAY
              );

              status.setPadding(
                0,
                0,
                0,
                10
              );

              root.addView(status);

              list =
                new ListView(this);

              root.addView(
                list,
                new LinearLayout.LayoutParams(
                  -1,
                  0,
                  1
                )
              );

              now =
                new TextView(this);

              now.setText(
                "Nothing playing"
              );

              now.setTextColor(
                Color.WHITE
              );

              now.setTextSize(16);

              now.setTypeface(
                Typeface.DEFAULT_BOLD
              );

              now.setGravity(
                Gravity.CENTER
              );

              now.setPadding(
                0,
                12,
                0,
                4
              );

              root.addView(now);

              seek =
                new SeekBar(this);

              root.addView(seek);

              LinearLayout controls =
                new LinearLayout(this);

              controls.setOrientation(
                LinearLayout.HORIZONTAL
              );

              Button previous =
                new Button(this);

              play =
                new Button(this);

              Button next =
                new Button(this);

              previous.setText("PREV");
              play.setText("PLAY");
              next.setText("NEXT");

              controls.addView(
                previous,
                new LinearLayout.LayoutParams(
                  0,
                  -2,
                  1
                )
              );

              controls.addView(
                play,
                new LinearLayout.LayoutParams(
                  0,
                  -2,
                  1
                )
              );

              controls.addView(
                next,
                new LinearLayout.LayoutParams(
                  0,
                  -2,
                  1
                )
              );

              root.addView(controls);

              setContentView(root);

              refresh.setOnClickListener(
                view -> scan()
              );

              spotify.setOnClickListener(
                view -> Toast.makeText(
                  this,
                  "Spotify is the playlist source. Account connection comes after the Pulse Spotify developer app is available.",
                  Toast.LENGTH_LONG
                ).show()
              );

              list.setOnItemClickListener(
                (parent, view, position, id) ->
                  playSong(position)
              );

              play.setOnClickListener(
                view -> toggle()
              );

              previous.setOnClickListener(
                view -> {

                  if (!songs.isEmpty()) {

                    int target =
                      current <= 0
                        ? songs.size() - 1
                        : current - 1;

                    playSong(target);
                  }
                }
              );

              next.setOnClickListener(
                view -> nextSong()
              );

              seek.setOnSeekBarChangeListener(
                new SeekBar.OnSeekBarChangeListener() {

                  @Override
                  public void onProgressChanged(
                    SeekBar seekBar,
                    int progress,
                    boolean fromUser
                  ) {
                  }

                  @Override
                  public void onStartTrackingTouch(
                    SeekBar seekBar
                  ) {
                  }

                  @Override
                  public void onStopTrackingTouch(
                    SeekBar seekBar
                  ) {

                    try {

                      if (player != null) {

                        player.seekTo(
                          seekBar.getProgress()
                        );
                      }

                    } catch (Exception ignored) {
                    }
                  }
                }
              );
            }

            void requestAudio() {

              String permission =
                Build.VERSION.SDK_INT >= 33
                  ? Manifest.permission.READ_MEDIA_AUDIO
                  : Manifest.permission.READ_EXTERNAL_STORAGE;

              if (
                checkSelfPermission(permission)
                  != PackageManager.PERMISSION_GRANTED
              ) {

                requestPermissions(
                  new String[] {
                    permission
                  },
                  7
                );

              } else {

                scan();
              }
            }

            @Override
            public void onRequestPermissionsResult(
              int requestCode,
              String[] permissions,
              int[] grantResults
            ) {

              super.onRequestPermissionsResult(
                requestCode,
                permissions,
                grantResults
              );

              if (
                requestCode == 7 &&
                grantResults.length > 0 &&
                grantResults[0]
                  == PackageManager.PERMISSION_GRANTED
              ) {

                scan();

              } else {

                status.setText(
                  "Allow Music and audio access to play songs."
                );
              }
            }

            void scan() {

              songs.clear();
              labels.clear();

              Uri base =
                MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;

              String[] columns = {
                MediaStore.Audio.Media._ID,
                MediaStore.Audio.Media.TITLE,
                MediaStore.Audio.Media.ARTIST
              };

              try (
                Cursor cursor =
                  getContentResolver().query(
                    base,
                    columns,
                    MediaStore.Audio.Media.IS_MUSIC + "!=0",
                    null,
                    MediaStore.Audio.Media.TITLE + " COLLATE NOCASE"
                  )
              ) {

                if (cursor != null) {

                  int idIndex =
                    cursor.getColumnIndexOrThrow(
                      MediaStore.Audio.Media._ID
                    );

                  int titleIndex =
                    cursor.getColumnIndexOrThrow(
                      MediaStore.Audio.Media.TITLE
                    );

                  int artistIndex =
                    cursor.getColumnIndexOrThrow(
                      MediaStore.Audio.Media.ARTIST
                    );

                  while (
                    cursor.moveToNext()
                  ) {

                    String title =
                      cursor.getString(
                        titleIndex
                      );

                    String artist =
                      cursor.getString(
                        artistIndex
                      );

                    if (
                      title == null ||
                      title.isEmpty()
                    ) {

                      title =
                        "Unknown track";
                    }

                    if (
                      artist == null ||
                      artist.isEmpty() ||
                      "<unknown>".equals(
                        artist
                      )
                    ) {

                      artist =
                        "Unknown artist";
                    }

                    Uri uri =
                      ContentUris.withAppendedId(
                        base,
                        cursor.getLong(
                          idIndex
                        )
                      );

                    songs.add(
                      new Song(
                        title,
                        artist,
                        uri
                      )
                    );

                    labels.add(
                      title +
                      "\n" +
                      artist
                    );
                  }
                }

              } catch (Exception exception) {

                status.setText(
                  "Could not scan music."
                );
              }

              ArrayAdapter<String> adapter =
                new ArrayAdapter<String>(
                  this,
                  android.R.layout.simple_list_item_1,
                  labels
                ) {

                  @Override
                  public View getView(
                    int position,
                    View convertView,
                    ViewGroup parent
                  ) {

                    TextView view =
                      (TextView)
                        super.getView(
                          position,
                          convertView,
                          parent
                        );

                    view.setTextColor(
                      Color.WHITE
                    );

                    view.setTextSize(16);

                    view.setPadding(
                      18,
                      18,
                      18,
                      18
                    );

                    view.setBackgroundColor(
                      Color.rgb(
                        15,
                        16,
                        22
                      )
                    );

                    return view;
                  }
                };

              list.setAdapter(adapter);

              if (songs.isEmpty()) {

                status.setText(
                  "No local songs found yet."
                );

              } else {

                status.setText(
                  songs.size() +
                  " playable songs found"
                );
              }
            }

            void playSong(int index) {

              if (
                index < 0 ||
                index >= songs.size()
              ) {

                return;
              }

              releasePlayer();

              current = index;

              Song song =
                songs.get(index);

              player =
                MediaPlayer.create(
                  this,
                  song.uri
                );

              if (player == null) {

                Toast.makeText(
                  this,
                  "Could not play this file.",
                  Toast.LENGTH_SHORT
                ).show();

                return;
              }

              now.setText(
                song.title +
                "\n" +
                song.artist
              );

              seek.setMax(
                Math.max(
                  player.getDuration(),
                  1
                )
              );

              player.setOnCompletionListener(
                mediaPlayer ->
                  nextSong()
              );

              player.start();

              play.setText(
                "PAUSE"
              );
            }

            void toggle() {

              if (player == null) {

                if (!songs.isEmpty()) {

                  playSong(
                    current < 0
                      ? 0
                      : current
                  );
                }

                return;
              }

              if (
                player.isPlaying()
              ) {

                player.pause();

                play.setText(
                  "PLAY"
                );

              } else {

                player.start();

                play.setText(
                  "PAUSE"
                );
              }
            }

            void nextSong() {
                            if (!songs.isEmpty()) {
                playSong(
                  current >= songs.size() - 1
                    ? 0
                    : current + 1
                );
              }
            }

            void releasePlayer() {
              if (player != null) {
                try {
                  player.release();
                } catch (Exception ignored) {
                }

                player = null;
              }
            }

            @Override
            protected void onDestroy() {
              handler.removeCallbacks(tick);
              releasePlayer();
              super.onDestroy();
            }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-v0.3-clean-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
