name: Build Pulse Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Pulse v0.2
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/pulse

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "Pulse"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id "com.android.application" version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id "com.android.application" }
          android {
            namespace "com.example.pulse"
            compileSdk 35
            defaultConfig {
              applicationId "com.example.pulse"
              minSdk 26
              targetSdk 35
              versionCode 2
              versionName "0.2"
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:allowBackup="true" android:label="Pulse"
              android:theme="@android:style/Theme.Material.NoActionBar"
              android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true"
                android:launchMode="singleTask">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="pulse-auth" android:host="callback" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > MainActivity.java.gz.b64 <<'EOF'
