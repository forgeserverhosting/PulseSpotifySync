              private void showLibrary() {
                  content.removeAllViews();

                  LinearLayout page = new LinearLayout(this);
                  page.setOrientation(LinearLayout.VERTICAL);

                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  header.setPadding(dp(20), dp(4), dp(12), dp(10));

                  LinearLayout titles = new LinearLayout(this);
                  titles.setOrientation(LinearLayout.VERTICAL);

                  TextView title = new TextView(this);
                  title.setText("On this phone");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(23);
                  title.setTypeface(Typeface.DEFAULT_BOLD);

                  TextView count = new TextView(this);
                  count.setText(songs.size() + " songs");
                  count.setTextColor(Color.rgb(130, 134, 145));
                  count.setTextSize(13);

                  titles.addView(title);
                  titles.addView(count);

                  header.addView(
                      titles,
                      new LinearLayout.LayoutParams(0, -2, 1)
                  );

                  Button refresh = new Button(this);
                  refresh.setText("↻");
                  refresh.setTextSize(24);
                  refresh.setTextColor(Color.WHITE);

                  GradientDrawable refreshBg = new GradientDrawable();
                  refreshBg.setColor(Color.rgb(27, 29, 37));
                  refreshBg.setCornerRadius(dp(50));

                  refresh.setBackground(refreshBg);

                  header.addView(
                      refresh,
                      new LinearLayout.LayoutParams(dp(52), dp(52))
                  );

                  refresh.setOnClickListener(v -> loadSongs());

                  page.addView(header);

                  emptyText = new TextView(this);
