      - name: Build Pulse v0.2 APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-v0.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
