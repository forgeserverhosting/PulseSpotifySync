name: Build Pulse v0.3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Pulse
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/pulse

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Pulse"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.example.pulse"
              compileSdk 35

              defaultConfig {
                  applicationId "com.example.pulse"
                  minSdk 26
                  targetSdk 35
                  versionCode 3
                  versionName "0.3"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />

              <application
                  android:allowBackup="true"
                  android:label="Pulse"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/example/pulse/MainActivity.java <<'EOF'
          package com.example.pulse;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentUris;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.media.MediaPlayer;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {

              static class Song {
                  String title;
                  String artist;
                  Uri uri;

                  Song(String title, String artist, Uri uri) {
                      this.title = title;
                      this.artist = artist;
                      this.uri = uri;
                  }
              }

              private final ArrayList<Song> songs = new ArrayList<>();
              private final ArrayList<String> labels = new ArrayList<>();

              private ListView list;
              private TextView status;
              private TextView nowPlaying;
              private SeekBar seek;

              private Button play;
              private Button previous;
              private Button next;

              private MediaPlayer player;
              private int current = -1;

              private final Handler handler = new Handler();

              private final Runnable progress = new Runnable() {
                  @Override
                  public void run() {
                      try {
                          if (player != null) {
                              seek.setMax(Math.max(player.getDuration(), 1));
                              seek.setProgress(player.getCurrentPosition());
                          }
                      } catch (Exception ignored) {
                      }

                      handler.postDelayed(this, 500);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  buildUI();
                  requestMusicPermission();

                  handler.post(progress);
              }

              private void buildUI() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(8, 9, 13));
                  root.setPadding(24, 24, 24, 24);

                  TextView logo = new TextView(this);
                  logo.setText("PULSE");
                  logo.setTextColor(Color.WHITE);
                  logo.setTextSize(34);
                  logo.setTypeface(Typeface.DEFAULT_BOLD);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("Your playlists. Your music. Your player.");
                  subtitle.setTextColor(Color.rgb(145, 145, 155));
                  subtitle.setTextSize(15);

                  root.addView(logo);
                  root.addView(subtitle);

                  LinearLayout topButtons = new LinearLayout(this);
                  topButtons.setOrientation(LinearLayout.HORIZONTAL);
                  topButtons.setPadding(0, 20, 0, 20);

                  Button refresh = new Button(this);
                  refresh.setText("Refresh music");
                  refresh.setAllCaps(false);

                  Button spotify = new Button(this);
                  spotify.setText("Spotify Import");
                  spotify.setAllCaps(false);

                  topButtons.addView(
                      refresh,
                      new LinearLayout.LayoutParams(0, -2, 1)
                  );

                  topButtons.addView(
                      spotify,
                      new LinearLayout.LayoutParams(0, -2, 1)
                  );

                  root.addView(topButtons);

                  status = new TextView(this);
                  status.setText("Looking for music...");
                  status.setTextColor(Color.rgb(150, 150, 160));
                  status.setTextSize(14);
                  status.setPadding(4, 0, 4, 12);

                  root.addView(status);

                  list = new ListView(this);
                  list.setDividerHeight(1);
                  list.setBackgroundColor(Color.TRANSPARENT);

                  root.addView(
                      list,
                      new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1
                      )
                  );

                  nowPlaying = new TextView(this);
                  nowPlaying.setText("Nothing playing");
                  nowPlaying.setTextColor(Color.WHITE);
                  nowPlaying.setTextSize(17);
                  nowPlaying.setTypeface(Typeface.DEFAULT_BOLD);
                  nowPlaying.setGravity(Gravity.CENTER);
                  nowPlaying.setPadding(0, 16, 0, 8);

                  root.addView(nowPlaying);

                  seek = new SeekBar(this);
                  root.addView(seek);

                  LinearLayout controls = new LinearLayout(this);
                  controls.setGravity(Gravity.CENTER);

                  previous = new Button(this);
                  previous.setText("⏮");

                  play = new Button(this);
                  play.setText("▶");

                  next = new Button(this);
                  next.setText("⏭");

                  controls.addView(
                      previous,
                      new LinearLayout.LayoutParams(0, -2, 1)
                  );

                  controls.addView(
                      play,
                      new LinearLayout.LayoutParams(0, -2, 1)
                  );

                  controls.addView(
                      next,
                      new LinearLayout.LayoutParams(0, -2, 1)
                  );

                  root.addView(controls);

                  setContentView(root);

                  refresh.setOnClickListener(v -> loadSongs());

                  spotify.setOnClickListener(v ->
                      Toast.makeText(
                          this,
                          "Spotify will be the playlist source. Pulse playback is separate.",
                          Toast.LENGTH_LONG
                      ).show()
                  );

                  list.setOnItemClickListener(
                      (parent, view, position, id) -> playSong(position)
                  );

                  play.setOnClickListener(v -> toggle());

                  previous.setOnClickListener(v -> {
                      if (!songs.isEmpty()) {
                          int target = current <= 0
                              ? songs.size() - 1
                              : current - 1;

                          playSong(target);
                      }
                  });

                  next.setOnClickListener(v -> playNext());

                  seek.setOnSeekBarChangeListener(
                      new SeekBar.OnSeekBarChangeListener() {
                          @Override
                          public void onProgressChanged(
                              SeekBar bar,
                              int value,
                              boolean fromUser
                          ) {
                          }

                          @Override
                          public void onStartTrackingTouch(SeekBar bar) {
                          }

                          @Override
                          public void onStopTrackingTouch(SeekBar bar) {
                              try {
                                  if (player != null) {
                                      player.seekTo(bar.getProgress());
                                  }
                              } catch (Exception ignored) {
                              }
                          }
                      }
                  );
              }

              private void requestMusicPermission() {
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (
                          checkSelfPermission(
                              Manifest.permission.READ_MEDIA_AUDIO
                          ) != PackageManager.PERMISSION_GRANTED
                      ) {
                          requestPermissions(
                              new String[] {
                                  Manifest.permission.READ_MEDIA_AUDIO
                              },
                              100
                          );

                          return;
                      }
                  } else {
                      if (
                          checkSelfPermission(
                              Manifest.permission.READ_EXTERNAL_STORAGE
                          ) != PackageManager.PERMISSION_GRANTED
                      ) {
                          requestPermissions(
                              new String[] {
                                  Manifest.permission.READ_EXTERNAL_STORAGE
                              },
                              100
                          );

                          return;
                      }
                  }

                  loadSongs();
              }

              @Override
              public void onRequestPermissionsResult(
                  int requestCode,
                  String[] permissions,
                  int[] results
              ) {
                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      results
                  );

                  if (
                      requestCode == 100 &&
                      results.length > 0 &&
                      results[0] == PackageManager.PERMISSION_GRANTED
                  ) {
                      loadSongs();
                  } else {
                      status.setText(
                          "Music permission is required for local playback."
                      );
                  }
              }

              private void loadSongs() {
                  songs.clear();
                  labels.clear();

                  Uri source =
                      MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;

                  String[] columns = {
                      MediaStore.Audio.Media._ID,
                      MediaStore.Audio.Media.TITLE,
                      MediaStore.Audio.Media.ARTIST
                  };

                  try (
                      Cursor cursor = getContentResolver().query(
                          source,
                          columns,
                          MediaStore.Audio.Media.IS_MUSIC + " != 0",
                          null,
                          MediaStore.Audio.Media.TITLE + " ASC"
                      )
                  ) {
                      if (cursor != null) {
                          int idIndex =
                              cursor.getColumnIndexOrThrow(
                                  MediaStore.Audio.Media._ID
                              );

                          int titleIndex =
                              cursor.getColumnIndexOrThrow(
                                  MediaStore.Audio.Media.TITLE
                              );

                          int artistIndex =
                              cursor.getColumnIndexOrThrow(
                                  MediaStore.Audio.Media.ARTIST
                              );

                          while (cursor.moveToNext()) {
                              long id = cursor.getLong(idIndex);

                              String title =
                                  cursor.getString(titleIndex);

                              String artist =
                                  cursor.getString(artistIndex);

                              if (title == null) {
                                  title = "Unknown track";
                              }

                              if (
                                  artist == null ||
                                  artist.equals("<unknown>")
                              ) {
                                  artist = "Unknown artist";
                              }

                              Uri uri =
                                  ContentUris.withAppendedId(
                                      source,
                                      id
                                  );

                              songs.add(
                                  new Song(
                                      title,
                                      artist,
                                      uri
                                  )
                              );

                              labels.add(
                                  title + "\n" + artist
                              );
                          }
                      }
                  } catch (Exception e) {
                      status.setText(
                          "Could not scan music."
                      );
                  }

                  ArrayAdapter<String> adapter =
                      new ArrayAdapter<String>(
                          this,
                          android.R.layout.simple_list_item_1,
                          labels
                      ) {
                          @Override
                          public View getView(
                              int position,
                              View convertView,
                              android.view.ViewGroup parent
                          ) {
                              TextView view =
                                  (TextView) super.getView(
                                      position,
                                      convertView,
                                      parent
                                  );

                              view.setTextColor(Color.WHITE);
                              view.setTextSize(16);
                              view.setPadding(20, 20, 20, 20);
                              view.setBackgroundColor(
                                  Color.rgb(15, 16, 22)
                              );

                              return view;
                          }
                      };

                  list.setAdapter(adapter);

                  if (songs.isEmpty()) {
                      status.setText(
                          "No local songs found. Add MP3/M4A/FLAC files to the phone."
                      );
                  } else {
                      status.setText(
                          songs.size() + " playable songs found"
                      );
                  }
              }

              private void playSong(int index) {
                  if (index < 0 || index >= songs.size()) {
                      return;
                  }

                  current = index;
                  Song song = songs.get(index);

                  releasePlayer();

                  try {
                      player = new MediaPlayer();

                      player.setDataSource(
                          this,
                          song.uri
                      );

                      player.setOnPreparedListener(mp -> {
                          seek.setMax(
                              Math.max(
                                  mp.getDuration(),
                                  1
                              )
                          );

                          mp.start();
                          play.setText("⏸");
                      });

                      player.setOnCompletionListener(
                          mp -> playNext()
                      );

                      nowPlaying.setText(
                          song.title +
                          "\n" +
                          song.artist
                      );

                      player.prepareAsync();

                  } catch (Exception e) {
                      Toast.makeText(
                          this,
                          "Could notst source. Pulse playback is separate.",
                          Toast.LENGTH_LONG
                      ).show()
                  );

                  list.setOnItemClickListener(
                      (parent, view, position, id) -> playSong(position)
                  );

                  play.setOnClickListener(v -> toggle());

                  previous.setOnClickListener(v -> {
                      if (!songs.isEmpty()) {
                          int target = current <= 0
                              ? songs.size() - 1
                              : current - 1;

                          playSong(target);
                      }
                  });

                  next.setOnClickListener(v -> playNext());

                  seek.setOnSeekBarChangeListener(
                      new SeekBar.OnSeekBarChangeListener() {
                          @Override
                          public void onProgressChanged(
                              SeekBar bar,
                              int value,
                              boolean fromUser
                          ) {
                          }

                          @Override
                          public void onStartTrackingTouch(SeekBar bar) {
                          }

                          @Override
                          public void onStopTrackingTouch(SeekBar bar) {
                              try {
                                  if (player != null) {
                                      player.seekTo(bar.getProgress());
                                  }
                              } catch (Exception ignored) {
                              }
                          }
                      }
                  );
              }

              private void requestMusicPermission() {
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (
                          checkSelfPermission(
                              Manifest.permission.READ_MEDIA_AUDIO
                          ) != PackageManager.PERMISSION_GRANTED
                      ) {
                          requestPermissions(
                              new String[] {
                                  Manifest.permission.READ_MEDIA_AUDIO
                              },
                              100
                          );

                          return;
                      }
                  } else {
                      if (
                          checkSelfPermission(
                              Manifest.permission.READ_EXTERNAL_STORAGE
                          ) != PackageManager.PERMISSION_GRANTED
                      ) {
                          requestPermissions(
                              new String[] {
                                  Manifest.permission.READ_EXTERNAL_STORAGE
                              },
                              100
                          );

                          return;
                      }
                  }

                  loadSongs();
              }

              @Override
              public void onRequestPermissionsResult(
                  int requestCode,
                  String[] permissions,
                  int[] results
              ) {
                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      results
                  );

                  if (
                      requestCode == 100 &&
                      results.length > 0 &&
                      results[0] == PackageManager.PERMISSION_GRANTED
                  ) {
                      loadSongs();
                  } else {
                      status.setText(
                          "Music permission is required for local playback."
                      );
                  }
              }

