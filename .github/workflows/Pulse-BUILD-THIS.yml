name: Build Pulse Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Pulse Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/pulse

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Pulse"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.example.pulse"
              compileSdk 35

              defaultConfig {
                  applicationId "com.example.pulse"
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName "0.1"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Pulse"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/example/pulse/MainActivity.java <<'EOF'
          package com.example.pulse;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(48, 48, 48, 48);
                  root.setBackgroundColor(Color.rgb(10, 10, 14));

                  TextView logo = new TextView(this);
                  logo.setText("PULSE");
                  logo.setTextColor(Color.WHITE);
                  logo.setTextSize(40);
                  logo.setTypeface(Typeface.DEFAULT_BOLD);
                  logo.setGravity(Gravity.CENTER);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("Your music. Your playlists. Synced.");
                  subtitle.setTextColor(Color.rgb(170, 170, 180));
                  subtitle.setTextSize(17);
                  subtitle.setGravity(Gravity.CENTER);
                  subtitle.setPadding(0, 20, 0, 60);

                  Button spotifyButton = new Button(this);
                  spotifyButton.setText("CONNECT SPOTIFY");
                  spotifyButton.setTextSize(16);
                  spotifyButton.setAllCaps(false);

                  LinearLayout.LayoutParams buttonParams =
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      );

                  spotifyButton.setLayoutParams(buttonParams);

                  spotifyButton.setOnClickListener(v ->
                      Toast.makeText(
                          this,
                          "Spotify connection is coming next.",
                          Toast.LENGTH_LONG
                      ).show()
                  );

                  TextView status = new TextView(this);
                  status.setText(
                      "\nPulse Android Test Build\n\n" +
                      "Spotify playlist sync will be connected after the APK pipeline is verified."
                  );
                  status.setTextColor(Color.rgb(120, 120, 130));
                  status.setTextSize(14);
                  status.setGravity(Gravity.CENTER);

                  root.addView(logo);
                  root.addView(subtitle);
                  root.addView(spotifyButton);
                  root.addView(status);

                  setContentView(root);
              }
          }
          EOF

      - name: Build Pulse APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Pulse APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
