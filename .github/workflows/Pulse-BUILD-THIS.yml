name: Build Pulse v0.3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Pulse v0.3
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/pulse

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Pulse"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.example.pulse"
              compileSdk 35

              defaultConfig {
                  applicationId "com.example.pulse"
                  minSdk 26
                  targetSdk 35
                  versionCode 3
                  versionName "0.3"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.READ_MEDIA_AUDIO" />

              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />

              <application
                  android:allowBackup="true"
                  android:label="Pulse"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />

                          <data
                              android:scheme="pulse-auth"
                              android:host="callback" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/example/pulse/MainActivity.java <<'EOF'
          package com.example.pulse;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentUris;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.media.MediaPlayer;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.BaseAdapter;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private static final int AUDIO_PERMISSION = 1001;

              /*
               * Spotify will use one Pulse developer Client ID later.
               * Users will NOT see or enter it in the finished app.
               */
              private static final String SPOTIFY_CLIENT_ID = "";

              private final ArrayList<Song> songs = new ArrayList<>();

              private LinearLayout root;
              private FrameLayout content;
              private ListView songList;
              private TextView emptyText;

              private TextView nowTitle;
              private TextView nowArtist;
              private TextView elapsed;
              private TextView total;

              private Button playPause;
              private Button previous;
              private Button next;

              private SeekBar seekBar;

              private MediaPlayer player;
              private int currentIndex = -1;

              private final Handler handler = new Handler();

              private boolean userSeeking = false;

              private final Runnable progressUpdater = new Runnable() {
                  @Override
                  public void run() {
                      try {
                          if (player != null) {
                              int position = player.getCurrentPosition();
                              int duration = player.getDuration();

                              if (!userSeeking) {
                                  seekBar.setMax(Math.max(duration, 1));
                                  seekBar.setProgress(position);
                              }

                              elapsed.setText(formatTime(position));
                              total.setText(formatTime(duration));
                          }
                      } catch (Exception ignored) {
                      }

                      handler.postDelayed(this, 500);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  buildUi();
                  requestAudioAccessIfNeeded();

                  handler.post(progressUpdater);
              }

              private void buildUi() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(8, 9, 13));

                  TextView logo = new TextView(this);
                  logo.setText("PULSE");
                  logo.setTextColor(Color.WHITE);
                  logo.setTextSize(30);
                  logo.setTypeface(Typeface.DEFAULT_BOLD);
                  logo.setGravity(Gravity.CENTER_VERTICAL);
                  logo.setPadding(dp(20), dp(18), dp(20), dp(4));

                  TextView subtitle = new TextView(this);
                  subtitle.setText("Your music. Your playlists. Your player.");
                  subtitle.setTextColor(Color.rgb(145, 148, 158));
                  subtitle.setTextSize(14);
                  subtitle.setPadding(dp(20), 0, dp(20), dp(14));

                  root.addView(logo);
                  root.addView(subtitle);

                  LinearLayout tabs = new LinearLayout(this);
                  tabs.setOrientation(LinearLayout.HORIZONTAL);
                  tabs.setPadding(dp(16), 0, dp(16), dp(12));

                  Button libraryTab = makeTab("LIBRARY");
                  Button spotifyTab = makeTab("SPOTIFY");

                  tabs.addView(
                      libraryTab,
                      new LinearLayout.LayoutParams(0, dp(48), 1)
                  );

                  LinearLayout.LayoutParams secondTabParams =
                      new LinearLayout.LayoutParams(0, dp(48), 1);

                  secondTabParams.setMargins(dp(8), 0, 0, 0);

                  tabs.addView(spotifyTab, secondTabParams);

                  root.addView(tabs);

                  content = new FrameLayout(this);

                  root.addView(
                      content,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1
                      )
                  );

                  buildPlayer();

                  libraryTab.setOnClickListener(v -> showLibrary());
                  spotifyTab.setOnClickListener(v -> showSpotify());

                  setContentView(root);

                  showLibrary();
              }

              private Button makeTab(String text) {
                  Button button = new Button(this);
                  button.setText(text);
                  button.setTextColor(Color.WHITE);
                  button.setTextSize(13);
                  button.setTypeface(Typeface.DEFAULT_BOLD);
                  button.setAllCaps(false);

                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.rgb(25, 27, 34));
                  bg.setCornerRadius(dp(14));

                  button.setBackground(bg);

                  return button;
              }

              private void showLibrary() {
                  content.removeAllViews();

                  LinearLayout page = new LinearLayout(this);
                  page.setOrientation(LinearLayout.VERTICAL);

                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  header.setPadding(dp(20), dp(4), dp(12), dp(10));

                  LinearLayout titles = new LinearLayout(this);
                  titles.setOrientation(LinearLayout.VERTICAL);

                  TextView title = new TextView(this);
                  title.setText("On this phone");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(23);
                  title.setTypeface(Typeface.DEFAULT_BOLD);

                  TextView count = new TextView(this);
                  count.setText(songs.size() + " songs");
                  count.setTextColor(Color.rgb(130, 134, 145));
                  count.setTextSize(13);

                  titles.addView(title);
                  titles.addView(count);

                  header.addView(
                      titles,
                      new LinearLayout.LayoutParams(0, -2, 1)
                  );

                  Button refresh = new Button(this);
                  refresh.setText("↻");
                  refresh.setTextSize(24);
                  refresh.setTextColor(Color.WHITE);

                  GradientDrawable refreshBg = new GradientDrawable();
                  refreshBg.setColor(Color.rgb(27, 29, 37));
                  refreshBg.setCornerRadius(dp(50));

                  refresh.setBackground(refreshBg);

                  header.addView(
                      refresh,
                      new LinearLayout.LayoutParams(dp(52), dp(52))
                  );

                  refresh.setOnClickListener(v -> loadSongs());

                  page.addView(header);

                  emptyText = new TextView(this);
                  emptyText.setText(
                      "No playable music found yet.\n\n" +
                      "Add MP3, M4A, FLAC or other audio files to your phone and Pulse will find them."
                  );
                  emptyText.setTextColor(Color.rgb(145, 148, 158));
                  emptyText.setTextSize(16);
                  emptyText.setGravity(Gravity.CENTER);
                  emptyText.setPadding(dp(30), dp(50), dp(30), dp(30));

                  songList = new ListView(this);
                  songList.setDivider(null);
                  songList.setBackgroundColor(Color.TRANSPARENT);
                  songList.setAdapter(new SongAdapter());

                  page.addView(
                      songList,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1
                      )
                  );

                  page.addView(emptyText);

                  content.addView(
                      page,
                      new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  );

                  updateLibraryEmptyState();
              }

              private void showSpotify() {
                  content.removeAllViews();

                  LinearLayout page = new LinearLayout(this);
                  page.setOrientation(LinearLayout.VERTICAL);
                  page.setGravity(Gravity.CENTER_HORIZONTAL);
                  page.setPadding(dp(24), dp(28), dp(24), dp(24));

                  TextView icon = new TextView(this);
                  icon.setText("♫");
                  icon.setTextSize(58);
                  icon.setTextColor(Color.WHITE);
                  icon.setGravity(Gravity.CENTER);

                  TextView title = new TextView(this);
                  title.setText("Import from Spotify");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(26);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, dp(16), 0, dp(10));

                  TextView info = new TextView(this);
                  info.setText(
                      "Spotify is only the source.\n\n" +
                      "Pulse will import your playlists and keep its own library. " +
                      "Playback stays inside Pulse whenever a playable audio source is available."
                  );
                  info.setTextColor(Color.rgb(155, 158, 169));
                  info.setTextSize(16);
                  info.setGravity(Gravity.CENTER);
                  info.setLineSpacing(0, 1.2f);
                  info.setPadding(0, 0, 0, dp(24));

                  Button connect = new Button(this);
                  connect.setText("Connect Spotify");
                  connect.setTextSize(16);
                  connect.setTextColor(Color.BLACK);
                  connect.setTypeface(Typeface.DEFAULT_BOLD);
                  connect.setAllCaps(false);

                  GradientDrawable spotifyBg = new GradientDrawable();
                  spotifyBg.setColor(Color.rgb(40, 220, 100));
                  spotifyBg.setCornerRadius(dp(20));

                  connect.setBackground(spotifyBg);

                  page.addView(icon);
                  page.addView(title);
                  page.addView(info);

                  page.addView(
                      connect,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(58)
                      )
                  );

                  TextView note = new TextView(this);
                  note.setText(
                      "\nSpotify authentication will use Pulse's own app credential — " +
                      "normal users will never need to enter a Client ID."
                  );
