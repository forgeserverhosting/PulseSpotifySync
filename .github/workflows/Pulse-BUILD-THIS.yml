          plugins { id "com.android.application" }
          android {
            namespace "com.example.pulse"
            compileSdk 35
            defaultConfig {
              applicationId "com.example.pulse"
              minSdk 26
              targetSdk 35
              versionCode 2
              versionName "0.2"
