name: Build Pulse v0.5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "pulse-test.jks"
      - ".github/workflows/Pulse-v05.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Pulse v0.5
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Pulse v0.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-v0.5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
