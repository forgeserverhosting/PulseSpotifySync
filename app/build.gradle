plugins { id "com.android.application" }

android {
    namespace "com.example.pulse"
    compileSdk 35

    signingConfigs {
        pulseTest {
            storeFile rootProject.file("pulse-test.jks")
            storePassword "pulsepass"
            keyAlias "pulse"
            keyPassword "pulsepass"
        }
    }

    defaultConfig {
        applicationId "com.example.pulse"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "0.5"
    }

    buildTypes {
        debug { signingConfig signingConfigs.pulseTest }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
